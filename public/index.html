<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lark 文档助手 · 本地演示</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📄 Lark 文档助手 <span class="sub">本地服务 · AI Agent × Lark CLI</span></div>
    <div class="actions">
      <span id="badge-mode" class="badge">加载中…</span>
      <span id="badge-lark" class="badge sim" title="lark CLI 连接状态">lark CLI 检测中…</span>
      <span id="badge-pi" class="badge sim hidden">pi SDK 未安装，将降级</span>
      <button id="sessions-btn" class="ghost" type="button">🗂 会话</button>
      <button id="llm-btn" class="ghost" type="button">⚙️ 配置 LLM</button>
      <button id="clear-btn" class="ghost" type="button">清空会话</button>
      <div id="sessions-panel" class="sessions-panel hidden"></div>
    </div>
  </header>

  <main id="chat" class="chat"></main>

  <div class="composer-wrap">
    <form id="composer" class="composer">
      <textarea id="input" rows="1"
        placeholder="输入问题，可附带飞书/Lark 文档链接（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
    <footer class="tips" id="tips">
      <span class="tips-label">示例文档（来自 lark doc list）：</span>
      <span id="examples"></span>
    </footer>
  </div>

  <div id="llm-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">AI 引擎配置 <span class="modal-sub">OpenAI 兼容 · Chat / Responses · pi Agent</span></div>
      <label class="field">
        <span>Agent 模式</span>
        <select id="llm-agent-mode">
          <option value="pi">pi Agent（system prompt 规则，模型自主调用 lark CLI）</option>
          <option value="builtin">内置编排（服务端预取文档 → LLM/模拟回答）</option>
        </select>
        <span class="field-hint">两种模式共用下方同一套凭据；保存配置时自动写入 pi 模式的自有配置目录（data/pi-agent/）。</span>
      </label>
      <label class="field">
        <span>接口类型</span>
        <select id="llm-type">
          <option value="chat">Chat Completions（/chat/completions）</option>
          <option value="responses">Responses（/responses）</option>
        </select>
      </label>
      <label class="field">
        <span>Base URL</span>
        <input id="llm-base" placeholder="https://api.openai.com/v1" />
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="llm-key" type="password" placeholder="sk-..." autocomplete="off" />
      </label>
      <div class="field">
        <span class="field-row">
          模型
          <span class="field-row-btns">
            <button type="button" id="llm-fetch-models" class="mini" title="从 Base URL 拉取可用模型列表（GET /models）">↻ 拉取列表</button>
            <button type="button" id="llm-manual-model" class="mini hidden" title="切换为手动输入模型名">✏️ 手动输入</button>
          </span>
        </span>
        <input id="llm-model" placeholder="gpt-4o-mini（手动输入，或拉取列表后下拉选择）" />
        <select id="llm-model-select" class="hidden"></select>
      </div>
      <div id="llm-msg" class="modal-msg"></div>
      <div class="modal-actions">
        <button type="button" id="llm-test" class="ghost">测试连接</button>
        <button type="button" id="llm-reset" class="ghost">恢复默认</button>
        <span class="spacer"></span>
        <button type="button" id="llm-cancel" class="ghost">取消</button>
        <button type="button" id="llm-save" class="primary">保存并生效</button>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.umd.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
